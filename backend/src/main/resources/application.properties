spring.application.name=mytasks-api
server.port=${PORT:8080}
server.error.include-message=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mytasks_dev}
spring.datasource.username=${DB_USER:mytasks_dev}
spring.datasource.password=${DB_PASSWORD:mytasks_dev_local_only}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}

spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
info.app.name=MyTasks API
info.app.description=Private task planning service
