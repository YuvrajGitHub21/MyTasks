services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: mytasks_dev
      POSTGRES_USER: mytasks_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mytasks_dev_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mytasks_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mytasks_dev -d mytasks_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mytasks_postgres_data:
