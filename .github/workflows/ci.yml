name: CI

on:
  push:
    branches: [master, M1]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analysis and Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Resolve locked Flutter packages
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart code
        run: flutter analyze

      - name: Build Android debug APK
        run: flutter build apk --debug

  backend:
    name: Java backend compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile backend
        run: bash ./mvnw --batch-mode -DskipTests compile
